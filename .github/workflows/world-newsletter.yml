name: Monthly World Newsletter (Stand der Welt)

on:
  # ABGESCHALTET (2026-07-25): läuft jetzt vom Mac-Mini-Runner
  # (ops/crontab.txt). GitHub-Cron feuerte parallel → doppelte Trigger
  # (Highlight-/Social-Mails kamen 2×). Manuell weiter per workflow_dispatch.
  # schedule:
  #   - cron: '20 6 1 * *'  # 06:20 UTC am 1. jedes Monats — nach dem Metrik-Fetch (05:00)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monthly world newsletter
        run: |
          curl -fsS -X POST "${BASE_URL}/api/cron/world-newsletter" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -w "\nHTTP %{http_code}\n"
        env:
          BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
