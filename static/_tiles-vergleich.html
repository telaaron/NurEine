<style>
  body { font-family: system-ui; background:#0e0e0f; color:#eee; margin:0; padding:16px; }
  h2 { font-size:14px; margin:0 0 4px; font-weight:600; }
  .note { font-size:11px; color:#888; margin:0 0 8px; }
  .row { margin-bottom:22px; }
  .map { height:420px; border:1px solid #333; border-radius:8px; }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div id="g"></div>

<script>
const VARIANTS = [
  ['dark_all — Labels im Basis-Tile (Marker verdecken sie)', 'dark_all', null],
  ['dark_nolabels + dark_only_labels ÜBER den Markern', 'dark_nolabels', 'dark_only_labels'],
];
const TONES = ['#c87340','#5a7a52','#b87a7a','#6c8aa8'];
const PTS = [[52.39,13.26],[52.52,13.40],[52.40,13.06],[52.27,13.59],[52.55,13.19]];

const g = document.getElementById('g');
VARIANTS.forEach(([label, path, labelPath], i) => {
  const wrap = document.createElement('div');
  wrap.className = 'row';
  wrap.innerHTML = `<h2>${label}</h2><div class="note">${path}</div><div class="map" id="m${i}"></div>`;
  g.appendChild(wrap);
  const m = L.map(`m${i}`, { center:[52.42,13.30], zoom:9, attributionControl:false, zoomControl:false });
  L.tileLayer(`https://{s}.basemaps.cartocdn.com/${path}/{z}/{x}/{y}{r}.png`, {maxZoom:19}).addTo(m);
  L.circle([52.39,13.26], {radius:20000, color:'#e9a972', weight:1, opacity:0.32, fill:false, dashArray:'3 7'}).addTo(m);
  L.circle([52.39,13.26], {radius:50000, color:'#e9a972', weight:1, opacity:0.24, fill:false, dashArray:'3 7'}).addTo(m);
  PTS.forEach((p,j) => L.circleMarker(p, {radius:9, color:'#fff', weight:1.25, opacity:0.85,
    fillColor:TONES[j%4], fillOpacity:0.92}).addTo(m));
  // Label-Overlay NACH den Markern → Ortsnamen bleiben lesbar
  if (labelPath) {
    L.tileLayer(`https://{s}.basemaps.cartocdn.com/${labelPath}/{z}/{x}/{y}{r}.png`,
      {maxZoom:19, pane:'markerPane'}).addTo(m);
  }
});
</script>
