name = "nureine-newsletter-cron"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Cron: 04:40 UTC täglich (= 06:40 CEST) — EINZIGER Lauf.
#   Verschoben 2026-07-22 von 04:20 → 04:40: Die Nacht-Kette auf dem Mac-Mini
#   (Fetch 03:10 → Chefredakteur 03:40 → Redaktion 04:10) braucht Puffer, damit
#   die frische Hero-Story fertig veredelt+bebildert+freigegeben ist, BEVOR der
#   Newsletter feuert. 04:40 = ~30 Min nach Redaktion-Start (statt 10 Min).
#
# KEIN Backup-Cron mehr (entfernt 2026-07-25). Der frühere 05:40-Lauf verschickte
# einen ZWEITEN Newsletter (Nutzer bekamen 06:40 UND 07:40 je eine Mail). Der
# Endpoint ist NICHT idempotent im angenommenen Sinn: sendDailyNewsletter() hat
# keine "heute schon versendet?"-Sperre. selectNewsletterStory() überspringt zwar
# die bereits gesendete Story (newsletter_sent_at gesetzt) — nimmt dann aber die
# NÄCHSTE ungesendete und schickt DIE raus. Zwei Crons = zwei volle Versände mit
# verschiedenen Stories. Ein Backup-Cron ist erst wieder sinnvoll, wenn der
# Endpoint eine echte Tages-Sperre bekommt.
[triggers]
crons = ["40 4 * * *"]

# Public vars (non-secret). Override per environment in the dashboard if needed.
[vars]
TARGET_URL = "https://nureine.de/api/cron/newsletter"

# Secrets (set via `wrangler secret put <NAME>` — never commit):
#   CRON_SECRET   shared bearer token, must match the SvelteKit env var
